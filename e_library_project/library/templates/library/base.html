<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}E-Library{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 20px;
        }
        nav {
            background-color: #e3f2fd;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
            color: #007bff;
        }
        nav a:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>

<nav>
    {% if user.is_authenticated %}
        <a href="{% url 'library_home' %}">🏠 Home</a>
        <a href="{% url 'my_bookmarks' %}">📑 My Bookmarks</a>
        <a href="{% url 'logout' %}">🔓 Logout</a>
    {% else %}
        <a href="{% url 'login' %}">🔐 Login</a>
        <a href="{% url 'signup' %}">📝 Sign Up</a>
    {% endif %}
</nav>

{% block content %}
{% block extra_js %}
{% endblock %}

</body>
</html>

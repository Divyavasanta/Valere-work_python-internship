{% load static %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">
    <a href="{% url 'library_home' %}" class="btn btn-secondary mb-3">⬅️ Back to Library</a>
    <div class="row">
        <div class="col-md-4">
            {% if book.thumbnail %}
                <img src="{{ book.thumbnail.url }}" class="img-fluid rounded shadow" alt="{{ book.title }}">
            {% else %}
                <img src="{% static 'images/default-thumbnail.png' %}" class="img-fluid rounded shadow" alt="No Image">
            {% endif %}
            <h3 class="mt-3">{{ book.title }}</h3>
            <p><strong>Author:</strong> {{ book.author }}</p>
            

            <!-- Bookmark -->
            <form action="{% url 'toggle_bookmark' %}" method="POST">
                {% csrf_token %}
                <input type="hidden" name="book_id" value="{{ book.id }}">
                <button type="submit" class="btn {% if is_bookmarked %}btn-danger{% else %}btn-outline-success{% endif %} w-100">
                    {% if is_bookmarked %}
                        🔖 Remove Bookmark
                    {% else %}
                        📌 Bookmark
                    {% endif %}
                </button>
            </form>
            <a href="{{ book.pdf_file.url }}" target="_blank" class="btn btn-outline-primary w-100 mt-2">
                 🔍 Open in New Tab
            </a>

        </div>

        <div class="col-md-8">
            <h4 class="mb-3">📄 Preview PDF:</h4>
            <iframe src="https://docs.google.com/viewer?embedded=true&url={{ absolute_pdf_url }}"
                    width="100%" height="600px" class="shadow-sm border rounded">
                This browser does not support PDF preview.

            </iframe>
        </div>
    </div>
</div>
{% endblock %}
